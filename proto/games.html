<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-game styles · Library of Limu</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/v4.css">
<script>
(function () {
  var t = null;
  try { var d = JSON.parse(localStorage.getItem('offy.v4') || 'null'); t = d && d.settings && d.settings.theme; } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  body { padding: 0 0 80px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px; }
  .top h1 { font-family: var(--display); font-size: 30px; }
  .top p { color: var(--muted); margin-top: 6px; max-width: 760px; line-height: 1.6; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 8px; }
  .toc a { padding: 7px 14px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); font-size: 13.5px; font-weight: 600; text-decoration: none; }
  .toc a.new { background: var(--seal-soft); color: var(--seal); }
  .sec { margin-top: 44px; scroll-margin-top: 16px; }
  .sec h2 { font-family: var(--display); font-size: 23px; display: flex; align-items: center; gap: 10px; }
  .sec h2 .tag { font: 700 11.5px var(--ui); padding: 3px 9px; border-radius: 99px; background: var(--seal); color: #fff6ea; }
  .sec h2 .tag.old { background: var(--surface-3); color: var(--ink-2); }
  .sec > p { color: var(--muted); margin: 6px 0 14px; font-size: 14px; }
  .vars { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
  .var { background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px; transition: border-color .2s, box-shadow .2s; }
  .var.on { border-color: var(--seal); box-shadow: 0 0 0 3px var(--seal-soft); }
  .var .vh { display: flex; align-items: center; gap: 8px; }
  .var .vh b { font-size: 15.5px; flex: 1; }
  .var .vh .k { font: 700 12px var(--ui); color: var(--seal); background: var(--seal-soft); border-radius: 8px; padding: 2px 8px; }
  .var .vd { font-size: 13px; color: var(--muted); line-height: 1.55; }
  .var .va { display: flex; gap: 8px; }
  .var .va button { flex: 1; height: 38px; border-radius: 12px; font-weight: 600; font-size: 13.5px; background: var(--surface-2); color: var(--ink-2); }
  .var.on .va .pick { background: var(--seal); color: #fff6ea; }
  .out { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50; display: flex; gap: 10px; align-items: center; padding: 10px 10px 10px 18px; border-radius: 18px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--sh-2); border: 1px solid var(--line); max-width: calc(100% - 24px); }
  .out span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
  .out button { height: 40px; padding: 0 16px; border-radius: 12px; background: var(--seal); color: #fff6ea; font-weight: 700; white-space: nowrap; }

  /* ---------- the demo stage ---------- */
  .demo { position: relative; height: 270px; border-radius: 18px; overflow: hidden; isolation: isolate; color: var(--ink); -webkit-user-select: none; user-select: none; }
  .demo.felt { background: radial-gradient(120% 140% at 0% 0%, var(--felt-a), var(--felt-b) 55%, var(--felt-c)); color: #fff; }
  .demo.paper { background: var(--paper); color: #1c1b19; }
  .demo.night { background: radial-gradient(120% 100% at 50% 110%, #2a2440, #12111c 70%); color: #fff; }
  .demo.water { background: linear-gradient(180deg, #1d5a6e, #0f3a4c); color: #fff; }
  .demo.wood { background: linear-gradient(180deg, #3b2c22, #2a1f18); color: #fff; }
  .demo .hz, .hz { font-family: var(--hz); font-weight: 400; }
  .pt { position: absolute; border-radius: 50%; pointer-events: none; z-index: 30; }
  .ft { position: absolute; z-index: 31; font: 800 18px var(--ui); color: var(--gold); text-shadow: 0 2px 8px rgba(0,0,0,.4); pointer-events: none; white-space: nowrap; }
  .ft.big { font-size: 26px; color: #fff; }
  .ft.bad { color: #ff7a66; }
  .tile { position: absolute; display: grid; place-items: center; background: var(--paper); color: #1c1b19; border-radius: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.25); font-family: var(--hz); }
  .sealx2 { display: grid; place-items: center; background: var(--seal); color: #fff6ea; border-radius: 12px; font-family: var(--hz); filter: url(#rough); }
  .ob { position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; z-index: 5; }
  .ob.n2 { grid-template-columns: repeat(2, 1fr); } .ob.n4 { grid-template-columns: repeat(4, 1fr); }
  .ob b { height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.12); color: inherit; font: 600 13.5px var(--ui); border: 1.5px solid rgba(255,255,255,.18); transition: background .2s, border-color .2s, transform .2s; }
  .paper .ob b { background: #fff; border-color: #e3dccb; color: #1c1b19; }
  .ob b.hz { font-family: var(--hz); font-size: 20px; font-weight: 400; }
  .ob b.pick { transform: scale(.94); border-color: var(--gold); }
  .ob b.ok { background: var(--good); border-color: var(--good); color: #fff; transform: scale(1.04); }
  .ob b.no { background: var(--bad); border-color: var(--bad); color: #fff; animation: shake .4s; }
  .ob b.dim { opacity: .35; }
  .flash { position: absolute; inset: 0; z-index: 40; pointer-events: none; opacity: 0; }
  .combo2 { position: absolute; right: 12px; top: 10px; z-index: 20; font: 800 14px var(--ui); color: var(--gold); background: rgba(0,0,0,.25); padding: 4px 10px; border-radius: 99px; opacity: 0; }
  .banner { position: absolute; left: 50%; top: 42%; z-index: 45; transform: translate(-50%, -50%); }

  /* duel */
  .hpbar { position: absolute; top: 12px; width: 40%; z-index: 6; }
  .hpbar.l { left: 12px; } .hpbar.r { right: 12px; text-align: right; }
  .hpbar span { font: 600 11.5px var(--ui); opacity: .85; }
  .hpbar i { display: block; height: 8px; margin-top: 4px; border-radius: 9px; background: rgba(0,0,0,.3); position: relative; overflow: hidden; }
  .hpbar i::after { content: ""; position: absolute; inset: 0; width: var(--w); background: linear-gradient(90deg, #f0c24b, #e3803c); border-radius: 9px; transition: width .5s cubic-bezier(.3,1.4,.5,1); }
  .hpbar.r i::after { left: auto; right: 0; background: linear-gradient(270deg, #7fb2e0, #3f7db5); }
  .fig { position: absolute; top: 54px; width: 76px; height: 76px; }
  .fig.l { left: 13%; } .fig.r { right: 13%; }
  .fig .sealx2 { width: 100%; height: 100%; font-size: 44px; border-radius: 20px; }
  .fig .sealx2.blue { background: #2c5f8f; }
  .duel-q { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); font-size: 40px; z-index: 6; text-shadow: 0 3px 10px rgba(0,0,0,.35); }
  .slash { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 8; pointer-events: none; overflow: visible; }
  .slash path { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 160; stroke-dashoffset: 160; filter: drop-shadow(0 0 6px rgba(255,220,140,.9)); }

  /* exam hall */
  .exam-top { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; align-items: center; gap: 10px; }
  .exam-top .sealx2 { width: 46px; height: 46px; font-size: 26px; background: #2c5f8f; }
  .exam-top .pat { flex: 1; }
  .exam-top .pat small { font: 600 11.5px var(--ui); color: #6c675e; }
  .exam-top .pat i { display: block; height: 7px; border-radius: 9px; background: #e9e3d4; overflow: hidden; margin-top: 4px; }
  .exam-top .pat i::after { content: ""; display: block; height: 100%; width: var(--w, 100%); background: var(--seal); transition: width .3s linear; }
  .sheet5 { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); display: flex; gap: 8px; }
  .sheet5 .cell { position: relative; width: 50px; height: 56px; border: 1.5px solid #d9a59c; border-radius: 8px; background: #fffdf8; display: grid; place-items: center; font-family: var(--hz); font-size: 30px; color: #1c1b19; }
  .sheet5 .cell .ink { clip-path: inset(0 100% 0 0); }
  .sheet5 .cell svg { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); }
  .sheet5 .cell svg circle { fill: none; stroke: var(--seal); stroke-width: 3; stroke-dasharray: 190; stroke-dashoffset: 190; }
  .prompt-l { position: absolute; left: 0; right: 0; top: 146px; text-align: center; font: 600 15px var(--ui); color: #4a463f; }

  /* card battle */
  .boss { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: 92px; height: 92px; }
  .boss .sealx2 { width: 100%; height: 100%; font-size: 52px; border-radius: 26px; background: #5b2a86; }
  .boss .ring { position: absolute; inset: -8px; }
  .boss .ring circle { fill: none; stroke-width: 5; }
  .boss .ring .bg { stroke: rgba(255,255,255,.12); }
  .boss .ring .hp { stroke: #e3803c; stroke-dasharray: 339; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .5s; }
  .bq { position: absolute; left: 50%; top: 122px; transform: translateX(-50%); font: 700 15px var(--ui); white-space: nowrap; }
  .hand { position: absolute; left: 50%; bottom: -14px; width: 0; height: 0; }
  .hand .card { position: absolute; left: -36px; bottom: 0; width: 72px; height: 98px; border-radius: 12px; background: var(--paper); color: #1c1b19; box-shadow: 0 8px 20px rgba(0,0,0,.35); display: grid; place-items: center; font-family: var(--hz); font-size: 30px; transform-origin: 50% 180%; transition: transform .35s cubic-bezier(.3,1.3,.5,1), filter .3s, opacity .3s; border: 2px solid #e9e3d4; }

  /* chain: stones */
  .river::before { content: ""; position: absolute; inset: 0; background: repeating-radial-gradient(circle at 30% 120%, transparent 0 18px, rgba(255,255,255,.05) 18px 20px); animation: drift 6s linear infinite; }
  @keyframes drift { to { background-position: 60px 0; } }
  .stone { position: absolute; width: 92px; height: 54px; border-radius: 50% 50% 46% 46%; background: linear-gradient(180deg, #c9c3b4, #8f897c); color: #1c1b19; display: grid; place-items: center; font-family: var(--hz); font-size: 24px; box-shadow: 0 10px 0 rgba(0,0,0,.18); transform: translate(-50%, -50%); transition: left .5s cubic-bezier(.4,0,.2,1), top .5s cubic-bezier(.4,0,.2,1), opacity .4s; }
  .stone.cand { animation: bob 2s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes bob { 50% { translate: 0 -5px; } }
  .stone.glow { box-shadow: 0 0 0 4px var(--gold), 0 10px 0 rgba(0,0,0,.18); }
  .stone u { text-decoration: none; color: var(--seal); }
  .hopper { position: absolute; width: 34px; height: 34px; z-index: 10; transform: translate(-50%, -100%); }
  .hopper .sealx2 { width: 100%; height: 100%; font-size: 20px; border-radius: 10px; }
  .ripple { position: absolute; width: 20px; height: 8px; border: 2px solid rgba(255,255,255,.6); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }

  /* chain: dragon */
  .dragon { position: absolute; left: 14px; right: 14px; top: 96px; display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
  .seg { flex: none; padding: 8px 10px; border-radius: 16px; background: var(--paper); color: #1c1b19; font-family: var(--hz); font-size: 22px; box-shadow: 0 6px 14px rgba(0,0,0,.25); animation: wave 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * -.18s); }
  .seg.head { background: var(--seal); color: #fff6ea; border-radius: 20px 26px 26px 20px; }
  .seg u { text-decoration: none; color: var(--seal); } .seg.head u { color: #ffe9a8; }
  @keyframes wave { 50% { transform: translateY(-9px); } }
  .need { position: absolute; left: 0; right: 0; top: 30px; text-align: center; font: 600 14px var(--ui); }
  .need .hz { font-size: 28px; color: var(--gold); vertical-align: -4px; margin: 0 4px; }

  /* chain: seals + thread */
  .rail { position: absolute; left: 0; top: 70px; height: 110px; display: flex; align-items: center; gap: 40px; padding-left: 26px; transition: transform .6s cubic-bezier(.4,0,.2,1); }
  .rail .ws { position: relative; flex: none; padding: 10px 14px; border-radius: 14px; background: var(--paper); color: #1c1b19; font-family: var(--hz); font-size: 28px; box-shadow: 0 6px 14px rgba(0,0,0,.2); }
  .rail .ws u { text-decoration: none; position: relative; }
  .rail .ws u.lit { color: var(--seal); text-shadow: 0 0 14px rgba(194,59,34,.5); }
  .thread { position: absolute; top: 50%; right: 100%; width: 40px; height: 4px; margin-top: -2px; background: var(--seal); transform-origin: left center; transform: scaleX(0); transition: transform .35s ease-out; border-radius: 2px; }
  .ws.linked .thread { transform: scaleX(1); }

  /* merge grid */
  .grid4 { position: absolute; left: 50%; top: 14px; width: 216px; height: 216px; transform: translateX(-50%); background: rgba(0,0,0,.22); border-radius: 16px; padding: 6px; }
  .grid4 .slot { position: absolute; width: 48px; height: 48px; border-radius: 10px; background: rgba(255,255,255,.07); }
  .grid4 .tile { width: 48px; height: 48px; font-size: 26px; transition: left .22s cubic-bezier(.3,0,.2,1), top .22s cubic-bezier(.3,0,.2,1), transform .25s; }
  .grid4 .tile.gold { background: linear-gradient(180deg, #f8e4a6, #e6b54e); font-size: 19px; letter-spacing: -1px; box-shadow: 0 0 18px rgba(230,181,78,.7), 0 6px 14px rgba(0,0,0,.25); }
  .score { position: absolute; left: 14px; top: 12px; font: 800 15px var(--ui); color: var(--gold); }

  /* merge furnace */
  .stone-pot { position: absolute; left: 50%; top: 52%; width: 110px; height: 110px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 50% 40%, #3a3a46, #15151b 70%); box-shadow: inset 0 -10px 20px rgba(0,0,0,.6), 0 0 0 6px #4b4b58; }
  .stone-pot.hot { box-shadow: inset 0 -10px 20px rgba(0,0,0,.6), 0 0 0 6px #e6b54e, 0 0 40px 10px rgba(230,181,78,.55); }
  .orb { position: absolute; width: 46px; height: 46px; font-size: 26px; transform: translate(-50%, -50%); transition: left .6s cubic-bezier(.5,0,.3,1), top .6s cubic-bezier(.5,0,.3,1), transform .3s, opacity .3s; }
  .born { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.3); opacity: 0; z-index: 20; text-align: center; }
  .born b { display: block; font-family: var(--hz); font-size: 40px; font-weight: 400; color: #fff; text-shadow: 0 0 18px rgba(230,181,78,.9); }
  .born small { font: 600 13px var(--ui); color: var(--gold); }

  /* merge drop */
  .cols { position: absolute; left: 50%; top: 10px; bottom: 10px; width: 220px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .cols > i { background: rgba(255,255,255,.06); border-radius: 10px; }
  .cols .tile { width: 50px; height: 46px; font-size: 26px; transition: top .45s cubic-bezier(.5,0,.5,1.3); }

  /* memory cards */
  .mem { position: absolute; inset: 16px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; perspective: 700px; }
  .mc { position: relative; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.4,0,.2,1); }
  .mc.up { transform: rotateY(180deg); }
  .mc > div { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; display: grid; place-items: center; }
  .mc .bk { background: repeating-linear-gradient(45deg, #2c5f8f 0 6px, #24507a 6px 12px); border: 3px solid #fffdf8; box-shadow: 0 6px 14px rgba(0,0,0,.3); }
  .mc .fr { background: var(--paper); color: #1c1b19; transform: rotateY(180deg); font: 600 14px var(--ui); box-shadow: 0 6px 14px rgba(0,0,0,.3); }
  .mc .fr.hz { font-family: var(--hz); font-size: 32px; font-weight: 400; }
  .mc.got { animation: gotIt .7s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes gotIt { 30% { transform: rotateY(180deg) scale(1.08); } to { transform: rotateY(180deg) scale(.2) translateY(-140px); opacity: 0; } }

  /* red thread match */
  .colL, .colR { position: absolute; top: 18px; bottom: 18px; display: flex; flex-direction: column; justify-content: space-between; }
  .colL { left: 18px; } .colR { right: 18px; }
  .colL b, .colR b { width: 110px; height: 56px; border-radius: 14px; background: var(--paper); color: #1c1b19; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(0,0,0,.25); transition: transform .3s, opacity .4s, box-shadow .3s; }
  .colL b { font-family: var(--hz); font-size: 28px; font-weight: 400; }
  .colR b { font: 600 14px var(--ui); }
  .colL b.done, .colR b.done { opacity: .25; transform: scale(.9); }
  .thr { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
  .thr path { fill: none; stroke: var(--seal); stroke-width: 4; stroke-linecap: round; }

  /* word blocks on a scroll */
  .scroll { position: absolute; left: 14px; right: 14px; top: 16px; height: 106px; background: var(--paper); border-radius: 10px; box-shadow: 0 8px 18px rgba(0,0,0,.35); transform-origin: left center; }
  .scroll::before, .scroll::after { content: ""; position: absolute; top: -6px; bottom: -6px; width: 12px; border-radius: 6px; background: #7a4b2a; }
  .scroll::before { left: -6px; } .scroll::after { right: -6px; }
  .scroll .py { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font: 600 15px var(--pinyin); color: #24507a; clip-path: inset(0 100% 0 0); }
  .blk { position: absolute; height: 48px; min-width: 52px; padding: 0 12px; border-radius: 10px; background: linear-gradient(180deg, #d9a96a, #b98345); color: #2a1a0c; font-family: var(--hz); font-size: 26px; display: grid; place-items: center; box-shadow: 0 5px 0 #7a5228, 0 10px 18px rgba(0,0,0,.3); transition: left .45s cubic-bezier(.5,0,.3,1), top .45s cubic-bezier(.5,0,.3,1); }

  /* train */
  .track { position: absolute; left: 0; right: 0; top: 120px; height: 6px; background: repeating-linear-gradient(90deg, #6b5847 0 14px, transparent 14px 22px); }
  .train { position: absolute; left: 14px; top: 64px; display: flex; gap: 6px; align-items: flex-end; transition: transform 1.2s cubic-bezier(.6,0,.4,1); }
  .loco { width: 60px; height: 56px; border-radius: 12px 22px 8px 8px; background: var(--seal); position: relative; }
  .loco::before { content: ""; position: absolute; left: 10px; top: -16px; width: 14px; height: 18px; background: #333; border-radius: 4px 4px 0 0; }
  .car { width: 56px; height: 50px; border-radius: 10px; background: #2c5f8f; color: #fff; display: grid; place-items: center; font-family: var(--hz); font-size: 24px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .car.wait { position: absolute; transition: left .5s cubic-bezier(.5,0,.3,1), top .5s cubic-bezier(.5,0,.3,1), transform .3s; }
  .puff { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.6); pointer-events: none; }

  /* cloze */
  .sent { position: absolute; left: 0; right: 0; top: 52px; text-align: center; font-family: var(--hz); font-size: 34px; color: #1c1b19; }
  .gap2 { display: inline-block; position: relative; min-width: 1.4em; height: 1.2em; vertical-align: -.18em; border-bottom: 3px solid #24507a; margin: 0 4px; }
  .gap2 .w { position: absolute; inset: 0; display: grid; place-items: center; color: var(--seal); }
  .stampx { position: absolute; z-index: 20; width: 64px; height: 64px; font-size: 36px; border-radius: 14px; }
  .mean2 { position: absolute; left: 0; right: 0; top: 112px; text-align: center; font: 500 14px var(--ui); color: #6c675e; }
  .brush { position: absolute; z-index: 20; width: 14px; height: 40px; background: linear-gradient(180deg, #7a4b2a 60%, #1c1b19 60%); border-radius: 4px 4px 10px 10px; transform-origin: 50% 100%; transform: rotate(25deg); opacity: 0; }

  /* tone: draw contour */
  .tcard { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); text-align: center; }
  .tcard .hz { font-size: 48px; color: #1c1b19; display: block; }
  .tcard .py { font: 600 22px var(--pinyin); color: #24507a; }
  .pad { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: 220px; height: 120px; border-radius: 14px; background: #f1ebdc; }
  .pad svg { width: 100%; height: 100%; }
  .pad .ghost { fill: none; stroke: #d8cfbb; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 14; }
  .pad .ink { fill: none; stroke: #1c1b19; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .pad .ink.ok { stroke: var(--good); }
  .fing { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: rgba(36,80,122,.35); border: 2px solid #24507a; transform: translate(-50%, -50%); z-index: 5; }

  /* tone: pitch ladder */
  .ladder { position: absolute; left: 20px; right: 20px; top: 20px; height: 150px; }
  .ladder .ln { position: absolute; left: 24px; right: 0; height: 1px; background: rgba(255,255,255,.18); }

/* ---------- build the page + run the demos ---------- */
const picks = {};
function render() {
  $('#toc').innerHTML = SECTIONS.map(s => `<a href="#s-${s.id}" class="${s.isNew ? 'new' : ''}">${s.name}</a>`).join('');
  $('#secs').innerHTML = SECTIONS.map(s => `<section class="sec" id="s-${s.id}"><h2>${s.name}<span class="tag ${s.isNew ? '' : 'old'}">${s.isNew ? 'ใหม่' : 'ปรับใหม่'}</span></h2><p>${s.desc}</p>
    <div class="vars">${s.vars.map(v => `<div class="var" data-sec="${s.id}" data-k="${v.k}"><div class="vh"><span class="k">${v.k}</span><b>${v.name}</b></div>
      <div class="demo ${v.bg}"></div><div class="vd">${v.d}</div>
      <div class="va"><button class="again">เล่นตัวอย่างใหม่</button><button class="pick">เลือกแบบนี้</button></div></div>`).join('')}</div></section>`).join('');
}
function run(card) {
  const el = $('.demo', card), fn = DEMOS[card.dataset.k], tok = (el._tok = (el._tok || 0) + 1), alive = () => el._tok === tok && card._vis;
  const W = ms => sleep(ms).then(() => { if (!alive()) throw 'stop'; });
  (async () => {
    while (alive()) {
      el.getAnimations({ subtree: true }).forEach(a => a.cancel()); el.innerHTML = '';
      try { await fn(el, W); } catch (e) { if (e !== 'stop') { console.error(card.dataset.k, e); return; } }
      if (!alive()) return; await sleep(800);
    }
  })();
}
function updateOut() {
  const t = SECTIONS.map(s => picks[s.id] ? `${s.name}: ${picks[s.id]}` : null).filter(Boolean).join(' · ');
  $('#outTxt').textContent = t || 'ยังไม่ได้เลือก';
}
render();
const io = new IntersectionObserver(es => es.forEach(e => { const c = e.target; const was = c._vis; c._vis = e.isIntersecting; if (c._vis && !was) run(c); }), { rootMargin: '120px' });
$$('.var').forEach(c => io.observe(c));
document.addEventListener('click', e => {
  const c = e.target.closest('.var'); if (!c) return;
  if (e.target.closest('.again')) { run(c); return; }
  if (e.target.closest('.pick')) {
    const s = c.dataset.sec, k = c.dataset.k, on = picks[s] === k;
    $$(`.var[data-sec="${s}"]`).forEach(x => x.classList.remove('on'));
    if (on) delete picks[s]; else { picks[s] = k; c.classList.add('on'); }
    updateOut();
  }
});
$('#outCopy').onclick = async () => {
  const txt = 'เลือกแบบมินิเกม — ' + ($('#outTxt').textContent);
  try { await navigator.clipboard.writeText(txt); $('#outCopy').textContent = 'คัดลอกแล้ว'; } catch (e) { prompt('คัดลอกข้อความนี้', txt); }
  setTimeout(() => $('#outCopy').textContent = 'คัดลอกตัวเลือก', 1600);
};
